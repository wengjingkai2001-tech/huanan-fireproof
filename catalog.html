  --blue: #003366;

*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:#111;touch-action:pan-y;-webkit-tap-highlight-color:transparent}

/* LANG BAR */
.lang-bar{position:fixed;top:0;left:0;right:0;z-index:200;display:flex;justify-content:center;gap:5px;padding:12px 12px;pointer-events:none;flex-wrap:wrap}
.lang-bar button{pointer-events:auto;padding:5px 13px;border-radius:16px;border:1px solid rgba(255,255,255,.4);background:rgba(0,0,0,.3);color:#fff;font-size:11px;backdrop-filter:blur(8px);transition:.25s;cursor:pointer}
.lang-bar button.on{background:#fff;color:var(--blue);border-color:#fff;font-weight:700}

/* BOOK CONTAINER —— 完全居中 */
.book-wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;perspective:1800px}
.book{position:relative;width:92vw;max-width:600px;height:86vh;max-height:820px;transform-style:preserve-3d}
.book.shadow:after{content:'';position:absolute;top:4px;left:2%;right:2%;bottom:-6px;background:rgba(0,0,0,.45);filter:blur(16px);z-index:-1;border-radius:6px}

/* PAGES */
.page-card{position:absolute;top:0;left:0;width:100%;height:100%;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.35,.05,.25,1);cursor:pointer;border-radius:3px;overflow:hidden;box-shadow:0 2px 20px rgba(0,0,0,.15)}
.page-front,.page-back{position:absolute;top:0;left:0;width:100%;height:100%;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:3px;overflow:hidden}
.page-back{transform:rotateY(180deg);background:#f5f3ee}

.cov{background:linear-gradient(160deg,#001a33 0%,var(--blue) 50%,#004d99 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;padding:40px 24px;position:relative}
.cov .brand{font-size:11px;letter-spacing:6px;color:var(--gold);margin-bottom:30px;text-transform:uppercase}
.cov .title{font-size:27px;font-weight:800;text-align:center;line-height:1.35;margin-bottom:16px}
.cov .line{width:40px;height:2px;background:var(--gold);margin:24px auto;border-radius:1px}
.cov .sub{font-size:12px;color:rgba(255,255,255,.6);letter-spacing:2px;text-align:center}
.cov .decor{position:absolute;top:-60px;right:-40px;width:200px;height:200px;border:2px solid rgba(255,255,255,.06);border-radius:50%}
.cov .decor2{position:absolute;bottom:-40px;left:-30px;width:140px;height:140px;border:1px solid rgba(255,255,255,.05);border-radius:50%}

/* END PAGE */
.end-page{background:linear-gradient(160deg,#001a33 0%,var(--blue) 50%,#004d99 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff}
.end-page .end-title{font-size:30px;font-weight:700;margin-bottom:12px}
.end-page .end-line{width:40px;height:2px;background:var(--gold);margin:20px auto;border-radius:1px}
.end-page .end-sub{font-size:13px;color:rgba(255,255,255,.55);letter-spacing:1px;text-align:center;padding:0 24px;line-height:1.8}
.end-page .end-contact{margin-top:26px;font-size:11px;color:rgba(255,255,255,.4);letter-spacing:1px;text-align:center;padding:0 30px;line-height:1.9}

.prod{background:var(--page-bg);display:flex;flex-direction:column}
.prod .top-bar{height:48px;background:var(--blue);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.prod .top-bar span{color:#fff;font-size:15px;font-weight:600;letter-spacing:1px}
.prod .img-area{flex:1;display:flex;align-items:center;justify-content:center;padding:12px;position:relative;overflow:hidden;min-height:0}
.prod .img-area img{max-width:100%;max-height:100%;object-fit:contain;border-radius:2px}
.prod .bot-bar{height:32px;background:#f5f5f5;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.prod .bot-bar span{color:#bbb;font-size:10px;letter-spacing:2px}

/* LOGO PAGE —— 黑底白 LOGO */
.logo-pg{background:#0d0d0d;display:flex;flex-direction:column}
.logo-pg .top-bar{height:48px;background:var(--blue);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo-pg .top-bar span{color:#fff;font-size:15px;font-weight:600;letter-spacing:1px}
.logo-pg .img-area{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;overflow:hidden;min-height:0;gap:26px}
.logo-row{display:flex;align-items:center;justify-content:center;gap:22px;width:100%}
.logo-row img{max-width:28%;max-height:92px;object-fit:contain;filter:brightness(0) invert(1)}
.logo-divider{width:1px;height:56px;background:rgba(255,255,255,.25);flex-shrink:0}
.logo-name{font-size:11px;color:rgba(255,255,255,.55);letter-spacing:3px;text-align:center;text-transform:uppercase}
.logo-pg .bot-bar{height:32px;background:#1a1a1a;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo-pg .bot-bar span{color:rgba(255,255,255,.35);font-size:10px;letter-spacing:2px}

/* GRID PAGE (projects / profiles) */
.grid-pg{background:var(--page-bg);display:flex;flex-direction:column}
.grid-pg .top-bar{height:48px;background:var(--blue);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.grid-pg .top-bar span{color:#fff;font-size:15px;font-weight:600;letter-spacing:1px}
.grid-pg .grid{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:14px;overflow:hidden;min-height:0}
.grid-pg .grid .cell{background:#f0f0f0;border-radius:6px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.grid-pg .grid .cell img{width:100%;height:100%;object-fit:cover}
.grid-cert{grid-template-columns:repeat(2,1fr);gap:12px}
.grid-cert .cell{flex-direction:column;position:relative}
.grid-cert .cell img{width:100%;height:100%;object-fit:contain;background:#fff}
.grid-cert .cell-cap{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.75));color:#fff;font-size:9px;text-align:center;padding:14px 2px 4px;line-height:1.3}
.grid-pg .bot-bar{height:32px;background:#f5f5f5;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.grid-pg .bot-bar span{color:#bbb;font-size:10px;letter-spacing:2px}

/* BIG IMAGE PAGE —— 大图整页显示 */
.big-pg{background:var(--page-bg);display:flex;flex-direction:column}
.big-pg .top-bar{height:48px;background:var(--blue);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.big-pg .top-bar span{color:#fff;font-size:15px;font-weight:600;letter-spacing:1px}

.big-pg .bot-bar{height:32px;background:#f5f5f5;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.big-pg .bot-bar span{color:#bbb;font-size:10px;letter-spacing:2px}

.ad-pg .ad-img{flex:1;display:flex;align-items:center;justify-content:center;padding:0}

.ad-pg .ad-bar span{color:#001a33;font-size:12px;font-weight:700;letter-spacing:2px}

.book-edge{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;border-radius:3px;box-shadow:inset -3px 0 8px rgba(0,0,0,.08), inset 3px 0 8px rgba(0,0,0,.08);z-index:100}

.nav{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);z-index:300;display:flex;align-items:center;gap:14px;background:rgba(0,0,0,.45);padding:8px 18px;border-radius:24px;backdrop-filter:blur(10px)}
.nav .dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.35);transition:.3s}
.nav .dot.cur{background:#fff;width:22px;border-radius:10px}
.nav .arr{color:#fff;font-size:20px;cursor:pointer;padding:4px 8px;line-height:1;opacity:.7;transition:.2s}
.nav .arr:active{opacity:1}
.nav .arr.hid{opacity:.15;pointer-events:none}
.nav .page-pos{color:rgba(255,255,255,.85);font-size:12px;letter-spacing:1px;min-width:64px;text-align:center;font-variant-numeric:tabular-nums}

.loader{position:fixed;top:0;left:0;width:100%;height:100%;background:#111;z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .4s}
.loader.done{opacity:0;pointer-events:none}
.loader .spinner{width:30px;height:30px;border:2px solid rgba(255,255,255,.12);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loader .txt{color:rgba(255,255,255,.4);font-size:11px;margin-top:14px;letter-spacing:3px}

/* SWIPE HINT */
.hint{position:fixed;bottom:110px;left:50%;transform:translateX(-50%);z-index:250;color:rgba(255,255,255,.35);font-size:11px;display:flex;align-items:center;gap:4px;animation:hintFade 2.5s infinite}
@keyframes hintFade{0%,100%{opacity:.4}50%{opacity:1}}
.hint.hide{display:none}

@media(min-width:768px){.book{max-width:600px}}
@media(max-height:600px){

/* ===== 悬浮控件 ===== */
.float-btn{position:fixed;right:16px;z-index:400;width:48px;height:48px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(0,0,0,.35);backdrop-filter:blur(6px);transition:transform .2s;font-size:20px}
.float-btn:active{transform:scale(.92)}
#musicBtn{bottom:96px;background:rgba(255,255,255,.95);color:var(--blue)}
#musicBtn.playing{animation:spinSlow 6s linear infinite}
#musicBtn.playing:after{content:'♪';position:absolute;top:4px;right:7px;font-size:11px;color:#e74c3c}
@keyframes spinSlow{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
#musicBtn .icon-mute{display:none}
#musicBtn.paused .icon-mute{display:block}
#musicBtn.paused .icon-play{display:none}
#contactBtn{bottom:40px;background:linear-gradient(135deg,#e74c3c,#c0392b);color:#fff}

.contact-panel .cp-title{font-size:14px;font-weight:700;color:var(--blue);margin-bottom:12px;display:flex;align-items:center;gap:6px}
.contact-panel .cp-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #f0f0f0;font-size:13px;color:#333;text-decoration:none}

.contact-panel .cp-val small{display:block;color:#999;font-size:11px}

  { src:'images/certificates/4.jpg', name:{ zh:'凤铝型材检验报告', th:'รายงานโปรไฟล์', en:'Fenglu Profile Report', ja:'型材検査報告', ru:'Отчет о профиле', fr:'Rapport profilé', de:'Profilprüfbericht' } },
  { src:'images/certificates/5.jpg', name:{ zh:'隔热胶条检验报告', th:'รายงานแถบฉนวน', en:'Thermal Strip Report', ja:'断熱材検査報告', ru:'Отчет об изоляции', fr:'Rapport isolation', de:'Isolierbandprüfbericht' } },
  { src:'images/certificates/6.jpg', name:{ zh:'铝材检验报告', th:'รายงานอลูมิเนียม', en:'Aluminum Report', ja:'アルミ検査報告', ru:'Отчет об алюминии', fr:'Rapport aluminium', de:'Aluminiumprüfbericht' } }
];

/* 项目实拍图（无语言版本） */
var PROJECTS = [
  'images/projects/huanyu-tianxia/img-01.jpg',
  'images/projects/huanyu-tianxia/img-02.jpg',
  'images/projects/jinke-boyue/img-01.jpg',
  'images/projects/jinke-cheng/img-01.jpg',
  'images/projects/nantian-mingyuan/img-01.jpg',
  'images/projects/huanyu-tianxia/img-07.jpg'
];

/* 产品名称（7语言） */
var PROD_NAMES = {
  p110:  { zh:'110系列', th:'110 ซีรีส์', en:'110 Series', ja:'110シリーズ', ru:'Серия 110', fr:'Série 110', de:'Serie 110' },
  p120:  { zh:'120系列', th:'120 ซีรีส์', en:'120 Series', ja:'120シリーズ', ru:'Серия 120', fr:'Série 120', de:'Serie 120' },
  p125:  { zh:'125六轨推拉窗', th:'125 ซีรีส์', en:'125 Series', ja:'125シリーズ', ru:'Серия 125', fr:'Série 125', de:'Serie 125' },
  lift:  { zh:'120提升窗', th:'120 หน้าต่างยกขึ้น', en:'120 Lift Window', ja:'120リフト窓', ru:'Подъемное окно 120', fr:'Fenêtre levante 120', de:'120 Hubfenster' },
  case:  { zh:'平开窗', th:'หน้าต่างบานเปิด', en:'Casement Window', ja:'開き窓', ru:'Поворотное окно', fr:'Fenêtre à battant', de:'Drehflügelfenster' },
  swin:  { zh:'推拉窗', th:'หน้าต่างบานเลื่อน', en:'Sliding Window', ja:'引違い窓', ru:'Раздвижное окно', fr:'Fenêtre coulissante', de:'Schiebefenster' },
  sdoor: { zh:'推拉门', th:'ประตูบานเลื่อน', en:'Sliding Door', ja:'引違いドア', ru:'Раздвижная дверь', fr:'Porte coulissante', de:'Schiebetür' }
};



var PROJ_NAMES = {
  huanyu: { zh:'寰宇天下·工装', th:'โครงการหวันอวี่', en:'Huanyu Tianxia', ja:'寰宇天下', ru:'Huanyu', fr:'Huanyu', de:'Huanyu' },
  boyue:  { zh:'金科铂悦都会', th:'จินเคอ โบ๊ยู', en:'Jinke Boyue', ja:'金科铂悦', ru:'Jinke Boyue', fr:'Jinke Boyue', de:'Jinke Boyue' },
  cheng:  { zh:'金科城·工装', th:'จินเคอเฉิง', en:'Jinke Cheng', ja:'金科城', ru:'Jinke Cheng', fr:'Jinke Cheng', de:'Jinke Cheng' },
  nantian: { zh:'南天名苑', th:'หนานเทียน', en:'Nantian Mingyuan', ja:'南天名苑', ru:'Nantian', fr:'Nantian', de:'Nantian' }
};

/* 页面顺序 */
var PAGES_TMPL = [
  { t:'cover' },
  { t:'logo' },
  { t:'prod', key:'p110' },
  { t:'prod', key:'p120' },
  { t:'prod', key:'p125' },
  { t:'prod', key:'lift' },
  { t:'prod', key:'case' },
  { t:'prod', key:'swin' },
  { t:'prod', key:'sdoor' },
  { t:'cert' },          /* 证书 1-2 */
  { t:'cert' },          /* 证书 3-4 */
  { t:'cert' },          /* 证书 5-6 */
  { t:'proj' },
  { t:'big', key:'showcase' },
  { t:'big', key:'swin' },
  { t:'big', key:'lift' },
  { t:'end' }
];

let lang='zh', idx=0, total=0, anim=false;
const book=document.getElementById('book');
const dotsEl=document.getElementById('dots');
const prevBtn=document.getElementById('prev');
const nextBtn=document.getElementById('next');
const hint=document.getElementById('hint');
const loader=document.getElementById('loader');
let imgLoadCount=0, imgTotal=0;

/* 展开模板（cert 分两页各 3 张） */
function expandTmpl(){
  let out=[];
  let certIdx=0;
  PAGES_TMPL.forEach(function(p){
    if(p.t==='cert'){
      out.push(Object.assign({}, p, {offset:certIdx*2}));
      certIdx++;
    } else {
      out.push(p);
    }
  });
  return out;
}

function imgSrc(key, lang){
  var v = IMG[key];
  if(!v) return '';
  if(typeof v === 'string') return v;
  return v[lang] || v.zh;
}

function buildHTML(){
  let h='';
  const T = L[lang];
  const pages = expandTmpl();
  total = pages.length;
  pages.forEach((p,i)=>{
    let z = total - i;
    let st = i===0 ? '' : ' style="transform:rotateY(180deg);pointer-events:none"';
    let inner = '';
    if(p.t==='cover'){
      inner = `<div class="page-front cov">
        <div class="decor"></div><div class="decor2"></div>
        <div class="brand">ZHENGXIN</div>
        <div class="title">${T.coverTitle}</div>
        <div class="line"></div>
        <div class="sub">${T.coverSub}</div>
      </div><div class="page-back"></div>`;
    } else if(p.t==='end'){
      inner = `<div class="page-front end-page">
        <div class="end-title">${T.endTitle}</div>
        <div class="end-line"></div>
        <div class="end-sub">${T.endSub}</div>
        <div class="end-contact">${T.contact}</div>
      </div><div class="page-back"></div>`;
    } else if(p.t==='logo'){
      const logos = BRAND_LOGOS.map(function(bl){
        return `<img src="${bl.src}" onload="imgDone()" onerror="imgDone()">`;
      }).join('');
      inner = `<div class="page-front logo-pg"><div class="top-bar"><span>${T.t_logo}</span></div>
        <div class="img-area">
          <div class="logo-row">${logos}</div>
          <div class="logo-name">ZHENGXIN DOORS &amp; WINDOWS</div>
        </div>
        <div class="bot-bar"><span>${T.bot}</span></div>
        <div class="pg-num">${i+1}/${total}</div></div><div class="page-back"></div>`;
    } else if(p.t==='prod'){
      const name = PROD_NAMES[p.key] ? (PROD_NAMES[p.key][lang] || PROD_NAMES[p.key].zh) : p.key;
      const src = imgSrc(p.key, lang);
      inner = `<div class="page-front prod"><div class="top-bar"><span>${name}</span></div>
        <div class="img-area"><img src="${src}" onload="imgDone()" onerror="imgDone()"></div>
        <div class="bot-bar"><span>${T.bot}</span></div>
        <div class="pg-num">${i+1}/${total}</div></div><div class="page-back"></div>`;
    } else if(p.t==='cert'){
      const list = CERTS.slice(p.offset, p.offset+2);
      const cells = list.map(function(cert, ci){
        const nm = cert.name[lang] || cert.name.zh;
        return `<div class="cell"><img src="${cert.src}" alt="${nm}" onload="imgDone()" onerror="imgDone()"><div class="cell-cap">${nm}</div></div>`;
      }).join('');
      inner = `<div class="page-front grid-pg"><div class="top-bar"><span>${T.t_cert}</span></div>
        <div class="grid grid-cert">${cells}</div>
        <div class="bot-bar"><span>${T.bot}</span></div>
        <div class="pg-num">${i+1}/${total}</div></div><div class="page-back"></div>`;
    } else if(p.t==='proj'){
      const cells = PROJECTS.map(function(src, ci){
        const name = (PROJ_NAMES[['huanyu','boyue','cheng','nantian'][ci]] || {})[lang] || '';
        return `<div class="cell"><img src="${src}" alt="${name}" onload="imgDone()" onerror="imgDone()"></div>`;
      }).join('');
      inner = `<div class="page-front grid-pg"><div class="top-bar"><span>${T.t_proj}</span></div>
        <div class="grid">${cells}</div>
        <div class="bot-bar"><span>${T.bot}</span></div>
        <div class="pg-num">${i+1}/${total}</div></div><div class="page-back"></div>`;
    } else if(p.t==='big'){
      const big = BIGS.filter(function(b){ return b.key===p.key; })[0];
      const name = big ? (big.label[lang] || big.label.zh) : p.key;
      const src = imgSrc(p.key, lang);
      inner = `<div class="page-front big-pg"><div class="top-bar"><span>${name}</span></div>
        <div class="img-area"><img src="${src}" onload="imgDone()" onerror="imgDone()"></div>
        <div class="bot-bar"><span>${T.bot}</span></div>
        <div class="pg-num">${i+1}/${total}</div></div><div class="page-back"></div>`;
    } else if(p.t==='ad'){
      inner = `<div class="page-front ad-pg">
        <div class="ad-img"><img src="${imgSrc('showcase', lang)}" onload="imgDone()" onerror="imgDone()"></div>
        <div class="ad-bar"><span>${T.t_ad}</span></div>
        <div class="pg-num" style="color:rgba(255,255,255,.5)">${i+1}/${total}</div>
      </div><div class="page-back"></div>`;
    }
    h += `<div class="page-card" data-i="${i}" style="z-index:${z}"${st}>${inner}</div>`;
  });
  book.innerHTML = h + '<div class="book-edge"></div>';
  imgTotal = 3 + 7 + 6 + 6 + 3; // logo3 + 产品7 + 证书6 + 项目6 + big3
  imgLoadCount = 0;
}

function imgDone(){
  imgLoadCount++;
  if(imgLoadCount >= imgTotal){
    setTimeout(()=>loader.classList.add('done'), 300);
  }
}

function buildDots(){
  let h='';
  for(let i=0;i<total;i++) h+=`<span class="dot${i===idx?' cur':''}" data-d="${i}"></span>`;
  dotsEl.innerHTML=h;
  prevBtn.classList.toggle('hid', idx===0);
  nextBtn.classList.toggle('hid', idx===total-1);
  const pos=document.getElementById('pagePos');
  if(pos) pos.textContent = (idx+1)+' / '+total;
}

function flipTo(target){
  if(anim || target===idx || target<0 || target>=total) return;
  anim=true;
  hint.classList.add('hide');
  const cards = book.querySelectorAll('.page-card');
  const dir = target > idx ? 1 : -1;

  cards.forEach(c=>{
    const i = parseInt(c.dataset.i);
    let s = c.style;
    s.transition = 'transform .6s cubic-bezier(.35,.05,.25,1)';
    s.transformOrigin = dir>0 ? 'left center' : 'right center';

    if(dir>0){
      if(i===idx) { s.transform='rotateY(-180deg)'; s.zIndex=0; s.pointerEvents='none'; }
      else if(i===target) { s.transform='rotateY(0deg)'; s.zIndex=total-target; s.pointerEvents='auto'; }
    } else {
      if(i===idx) { s.transform='rotateY(180deg)'; s.zIndex=0; s.pointerEvents='none'; }
      else if(i===target) { s.transform='rotateY(0deg)'; s.zIndex=total-target; s.pointerEvents='auto'; }
    }

    if(i>idx && i!==target) s.zIndex = total-i;
    if(i<idx && i!==target) s.zIndex = 0;
  });

  idx=target;
  buildDots();
  setTimeout(()=>{anim=false}, 620);
}

function switchLang(l){
  if(l===lang) return;
  lang=l;
  document.querySelectorAll('#langbar button').forEach(b=>b.classList.toggle('on',b.dataset.l===l));
  idx=0;
  loader.classList.remove('done');
  buildHTML();
  buildDots();
}

/* INIT */
function init(){
  const saved = (localStorage.getItem('catalog_lang') || '');
  if(L[saved]) lang = saved;
  document.querySelectorAll('#langbar button').forEach(b=>b.classList.toggle('on',b.dataset.l===lang));
  buildHTML();
  buildDots();
}
init();

/* Events */
document.getElementById('langbar').addEventListener('click',e=>{
  const b=e.target.closest('button');
  if(b){ switchLang(b.dataset.l); try{localStorage.setItem('catalog_lang',b.dataset.l);}catch(_){} }
});

prevBtn.addEventListener('click',()=>flipTo(idx-1));
nextBtn.addEventListener('click',()=>flipTo(idx+1));

dotsEl.addEventListener('click',e=>{
  const d=e.target.closest('.dot'); if(d) flipTo(parseInt(d.dataset.d));
});

document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight') flipTo(idx+1);
  if(e.key==='ArrowLeft') flipTo(idx-1);
});

let tsX=0, tsY=0, moved=false;
document.addEventListener('touchstart',e=>{
  tsX=e.touches[0].clientX; tsY=e.touches[0].clientY; moved=false;
},{passive:true});
document.addEventListener('touchmove',e=>{
  if(!moved&&(Math.abs(e.touches[0].clientX-tsX)>8||Math.abs(e.touches[0].clientY-tsY)>8)) moved=true;
},{passive:true});
document.addEventListener('touchend',e=>{
  if(!moved) return;
  const dx=e.changedTouches[0].clientX-tsX;
  const dy=e.changedTouches[0].clientY-tsY;
  if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>40){
    flipTo(dx<0?idx+1:idx-1);
  }
});

book.addEventListener('click',e=>{
  const rect=book.getBoundingClientRect();
  const x=e.clientX-rect.left;
  if(x>rect.width*.6) flipTo(idx+1);
  else if(x<rect.width*.4) flipTo(idx-1);
});

/* ============ BGM：《致爱丽丝》理查德·克莱德曼（真实音频） ============ */
(function(){
  var audio=null, playing=false;
  var btn=document.getElementById('musicBtn');

  function initAudio(){
    audio=new Audio('images/bgm.mp3');
    audio.loop=true;
    audio.preload='auto';
    audio.volume=.7;
  }

  function toggle(){
    if(!audio) initAudio();
    if(playing){
      audio.pause();
      playing=false;
      btn.classList.add('paused'); btn.classList.remove('playing');
    }else{
      var p=audio.play();
      if(p&&p.catch) p.catch(function(){});
      playing=true;
      btn.classList.remove('paused'); btn.classList.add('playing');
    }
  }

  btn.addEventListener('click',toggle);
  document.addEventListener('visibilitychange',function(){
    if(document.hidden&&playing){ toggle(); }
  });
})();

/* ============ 联系方式悬浮面板 ============ */
(function(){
  var btn=document.getElementById('contactBtn');
  var panel=document.getElementById('contactPanel');
  var wechat=document.getElementById('wechatLink');
  function toggle(e){
    e.stopPropagation();
    panel.classList.toggle('open');
  }
  btn.addEventListener('click',toggle);
  document.addEventListener('click',function(e){
    if(!panel.contains(e.target)&&e.target!==btn) panel.classList.remove('open');
  });
  if(wechat){
    wechat.addEventListener('click',function(e){
      e.preventDefault();
      alert('请用微信扫描官网二维码添加好友咨询');
    });
  }
})();
</script>
